name: Release

# Tag a version to cut a release:  git tag v1.0.0 && git push origin v1.0.0
# Builds the desktop application on all three platforms and attaches the
# installers to a GitHub release, which is what the landing page links to.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" \
              --draft \
              --title "Sprout Hollow $TAG" \
              --notes "Windows installer. It is not code-signed, so SmartScreen will warn on first run."
          fi

  # Sprout Hollow is a Windows application. There is deliberately no macOS or
  # Linux build: shipping a target nobody tests is worse than not shipping it.
  build:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the desktop application
        run: npm run package
        env:
          # electron-builder would otherwise try to discover a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release/*.exe --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false --latest
