name: Release

# Three ways in, one behaviour:
#   - push to main      CI that does not produce a downloadable build is not much use
#   - workflow_dispatch one click, no inputs required
#   - a v* tag          the explicit, versioned route
#
# Windows only, Squirrel.Windows, and permanently unsigned. The notes say so.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # First, and cheap: a bad packaging key would otherwise only surface after a
      # full typecheck, test run and renderer build.
      - name: Validate the electron-builder configuration
        run: npm run check:build

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Resolve the version and tag
        id: v
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else { $tag = "v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "Releasing $tag from $env:GITHUB_SHA"

      - name: Build the Squirrel.Windows package
        run: npm run package
        env:
          # Code signing is permanently prohibited for this project. Stop
          # electron-builder discovering a certificate and using it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # electron-builder writes the setup executable, RELEASES and the .nupkg files
      # under dist/squirrel-windows/, NOT the dist/ root. A collector that looks at
      # the root reports a missing setup even though packaging succeeded.
      - name: Collect the artifacts
        id: collect
        shell: pwsh
        run: |
          # electron-builder writes Squirrel output to <directories.output>/squirrel-windows.
          # This project sets that to "release", not the default "dist", so read it from the
          # manifest rather than hardcoding a path that is right for somebody else's repo.
          $outDir = (Get-Content package.json -Raw | ConvertFrom-Json).build.directories.output
          if (-not $outDir) { $outDir = "dist" }
          $src = Join-Path $outDir "squirrel-windows"

          if (-not (Test-Path $src)) {
            "Expected $src. What electron-builder actually produced:"
            Get-ChildItem $outDir -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object { "  " + $_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, "") }
            throw "no $src directory - Squirrel packaging did not produce its output where expected"
          }

          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "$src/*" staging -Recurse -Force

          $files = Get-ChildItem staging -File
          if (-not $files) { throw "staging is empty" }
          "Collected $($files.Count) files:"
          $files | ForEach-Object { "  {0,-52} {1:N0} bytes" -f $_.Name, $_.Length }

          $setup = $files | Where-Object { $_.Extension -eq ".exe" }
          if (-not $setup) { throw "no Setup .exe was produced" }
          $nupkg = $files | Where-Object { $_.Extension -eq ".nupkg" }
          if (-not $nupkg) { throw "no .nupkg was produced - Squirrel update assets are required" }
          if (-not (Test-Path staging/RELEASES)) { throw "no RELEASES file - Squirrel update feed is incomplete" }
          if (($setup | Measure-Object -Property Length -Sum).Sum -lt 40MB) {
            throw "the setup executable is implausibly small; this is not a real build"
          }

      # The release contract requires this assertion, not an assumption: every setup
      # executable must actually report NotSigned before anything is published.
      - name: Assert every executable is unsigned
        shell: pwsh
        run: |
          $bad = @()
          foreach ($exe in Get-ChildItem staging -Filter *.exe) {
            $status = (Get-AuthenticodeSignature $exe.FullName).Status
            "{0,-52} {1}" -f $exe.Name, $status
            if ($status -ne "NotSigned") { $bad += "$($exe.Name) reports $status" }
          }
          if ($bad) { throw "expected every artifact to be unsigned: $($bad -join '; ')" }

      - name: Hash the artifacts and count the lines
        id: notes
        shell: pwsh
        run: |
          $hashes = Get-ChildItem staging -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "| ``$($_.Name)`` | {0:N0} | ``$h`` |" -f $_.Length
          }
          $counts = (npm run count --silent) -join "`n"

          # The code name comes from the public dim-sum catalogue, fetched now. If
          # that catalogue cannot be read the script exits non-zero rather than
          # inventing a dish, and the release simply carries no code name.
          $dish = ""
          try {
            $dish = (npm run dish --silent) -join "`n"
            if ($LASTEXITCODE -ne 0) { $dish = "" }
          } catch { $dish = "" }
          if ($dish) { $dish = "## Code name`n`n$dish`n" }

          $body = @"
          Sprout Hollow ${{ steps.v.outputs.tag }} for Windows.

          Built by GitHub Actions from ``$env:GITHUB_SHA`` on this run. Typecheck and the
          full test suite ran and passed in this same job before packaging.

          $dish

          ## Install

          Download and run ``Sprout Hollow-Setup-${{ steps.v.outputs.version }}.exe``.

          **These artifacts are not code-signed.** Windows will show an unknown-publisher
          or SmartScreen warning the first time you run the installer. That warning is
          accurate: nothing here carries a signature and no authenticity or signature
          verification is claimed. Every build is produced in public from the source in
          this repository, and the hashes below are the ones this run generated. If you
          would rather not trust an unsigned binary, build it yourself with ``npm run package``.

          ## Update assets

          Squirrel.Windows: the ``RELEASES`` feed, the full ``.nupkg`` and any generated
          delta packages are attached alongside the installer.

          ## Artifacts

          | File | Bytes | SHA-256 |
          |---|---:|---|
          $($hashes -join "`n")

          ## Size of the tree at this commit

          Produced by ``npm run count`` over this exact commit, in this run.

          $counts
          "@

          $body | Set-Content release-notes.md -Encoding utf8
          "Wrote release-notes.md ($($body.Length) chars)"

      # One release per version. If the tag already carries a release, its assets and
      # notes are replaced rather than a second, duplicate release being created.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"

          # GitHub's own API answers 503 and 429 often enough to have cost this project a
          # red release for a build that was entirely sound: everything typechecked, every
          # test passed and the installer packaged, and then the publish call came back
          # "no server is currently available". A transient upstream failure is not a
          # failure of the release, so every call that talks to the API is retried.
          #
          # Retries are safe here because each call is idempotent in the state it leaves
          # behind: PATCH of a tag ref sets it, `release edit` sets the notes, and upload
          # uses --clobber. Re-running one is the same as running it once.
          function Invoke-WithRetry {
            param([string]$What, [scriptblock]$Body, [int]$Tries = 5)
            for ($i = 1; $i -le $Tries; $i++) {
              & $Body
              if ($LASTEXITCODE -eq 0) { return }
              if ($i -eq $Tries) { throw "$What failed after $Tries attempts (exit $LASTEXITCODE)" }
              $wait = [Math]::Min(60, [Math]::Pow(2, $i) * 5)
              "$What failed (exit $LASTEXITCODE). Retrying in $wait seconds - attempt $($i + 1) of $Tries."
              Start-Sleep -Seconds $wait
            }
          }

          $exists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }

          if ($exists) {
            "Release $tag exists - updating it in place."

            # The notes say "built from <sha>", so the tag has to agree. Without this
            # the tag stays pinned to whichever commit first published this version
            # while the artifacts and the notes move on, and the two quietly disagree
            # about what was actually released.
            Invoke-WithRetry "Moving tag $tag" {
              gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" `
                -f sha="$env:GITHUB_SHA" -F force=true | Out-Null
            }
            "Moved tag $tag to $env:GITHUB_SHA"

            Invoke-WithRetry "Editing release $tag" {
              gh release edit $tag --notes-file release-notes.md --title "Sprout Hollow $tag" --draft=false --latest
            }
            Invoke-WithRetry "Uploading assets to $tag" {
              gh release upload $tag (Get-ChildItem staging -File | ForEach-Object { $_.FullName }) --clobber
            }
          } else {
            "Creating release $tag."
            Invoke-WithRetry "Creating release $tag" {
              gh release create $tag (Get-ChildItem staging -File | ForEach-Object { $_.FullName }) `
                --title "Sprout Hollow $tag" --notes-file release-notes.md --latest
            }
          }

      - name: Confirm the release is downloadable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"

          # Read-only, and retried for the same reason the publish step is: a 503 here
          # would fail a release that is already published and downloadable, which would
          # be a lie in the opposite direction.
          function Read-WithRetry {
            param([string]$What, [scriptblock]$Body, [int]$Tries = 5)
            for ($i = 1; $i -le $Tries; $i++) {
              $out = & $Body
              if ($LASTEXITCODE -eq 0) { return $out }
              if ($i -eq $Tries) { throw "$What failed after $Tries attempts (exit $LASTEXITCODE)" }
              $wait = [Math]::Min(60, [Math]::Pow(2, $i) * 5)
              "$What failed (exit $LASTEXITCODE). Retrying in $wait seconds."
              Start-Sleep -Seconds $wait
            }
          }

          $json = (Read-WithRetry "Reading release $tag" {
            gh release view $tag --json isDraft,assets,tagName
          }) | ConvertFrom-Json
          if ($json.isDraft) { throw "the release is still a draft" }

          # The notes claim this release was built from GITHUB_SHA; prove the tag agrees.
          $tagged = Read-WithRetry "Reading tag $tag" {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" --jq .object.sha
          }
          if ($tagged -ne $env:GITHUB_SHA) {
            throw "tag $tag points at $tagged but this release was built from $env:GITHUB_SHA"
          }
          "Tag $tag correctly points at $tagged"
          $names = $json.assets.name
          "Published assets: $($names -join ', ')"
          foreach ($required in @('.exe', '.nupkg', 'RELEASES')) {
            if (-not ($names | Where-Object { $_ -like "*$required*" })) {
              throw "the published release is missing $required"
            }
          }
