name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the fast gate; windows is the platform this actually ships for,
        # so a Windows-only break must not wait until release day to be noticed.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # This job never launches Electron, only type-checks against it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the Electron main process
        run: npm run build:main

      - name: Build the renderer
        run: npm run build:renderer

      - name: Build the website
        run: npm run build:site

  screenshots:
    name: Render screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The shot renderer drives the real art modules. If someone changes a drawing
      # signature, this fails here rather than silently rotting until the README is
      # next regenerated.
      - name: Render the screenshots
        run: npx vitest run tests/shots.test.ts
        env:
          SHOTS: '1'

      - name: Upload the rendered frames
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/shots/*.png
          if-no-files-found: error

  package:
    name: Package the Windows installer
    # Only on the default branch and on demand: this pulls the real Electron binary
    # and runs electron-builder, which is far slower than the checks above.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Build the installer
        run: npm run package
        env:
          # Code signing is deliberately not configured; stop electron-builder
          # hunting for a certificate and failing on its absence.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the installer exists and is not a stub
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "electron-builder produced no .exe in release/" }
          if ($exe.Length -lt 40MB) { throw "installer is only $($exe.Length) bytes - that is not a real build" }
          "Built $($exe.Name), $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: sprout-hollow-setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
