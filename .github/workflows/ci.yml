name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the fast gate; windows is the platform this actually ships for,
        # so a Windows-only break must not wait until release day to be noticed.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Windows also starts the application (see the smoke step), so it needs the real
          # binary; ubuntu only type-checks against Electron. The value must be EMPTY to
          # download, not "0" — Electron's installer tests the variable for truthiness, and
          # the string "0" is truthy, which is exactly how the first version of this step
          # skipped the download and then failed for want of a binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ matrix.os == 'windows-latest' && '' || '1' }}

      - name: Validate the electron-builder configuration
        run: npm run check:build

      # Cheap, and it fails on a broken generator long before a release run would.
      - name: Generate and validate the application mark
        run: |
          npm run icon
          npm run check:icon

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the Electron main process
        run: npm run build:main

      - name: Build the renderer
        run: npm run build:renderer

      - name: Build the website
        run: npm run build:site

      # Everything above this line passed while the application was completely broken:
      # it installed, launched, ran four processes and never showed a window, through
      # four releases. Type-checking and unit tests examine modules; this starts the
      # program. Windows only — it is the platform this ships for, and the capture path
      # needs a real desktop rather than a GPU-less virtual display.
      - name: Start the application and require it to render
        if: matrix.os == 'windows-latest'
        run: npm run smoke

  screenshots:
    name: Render screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The shot renderer drives the real art modules, and the panel renderer drives the
      # real scene code. If someone changes a drawing signature or lays a panel out
      # wrongly, this fails here rather than silently rotting until the README is next
      # regenerated.
      #
      # `npm run shots` rather than a vitest line of its own: this step used to name
      # tests/shots.test.ts by hand and so rendered only half the matrix — the sixteen
      # panel captures never ran in CI at all, along with the checks that they are
      # reproducible. The npm script is the one supported way to produce the images, so
      # calling it here is what stops CI and a developer's machine drifting apart again.
      - name: Render the screenshots
        run: npm run shots

      - name: Upload the rendered frames
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/shots/*.png
          if-no-files-found: error

  # Packaging and publishing live in release.yml, which runs on every push to main.
  # Keeping them there means there is exactly one place that can produce a release,
  # so two workflows can never race to publish the same tag.
