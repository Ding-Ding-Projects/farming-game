name: Pages

# Publishes the landing and download page. The game itself is a desktop
# application and is not served from here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever attempt actually deployed. The retry below only runs when the first
      # attempt failed, so exactly one of these is ever set.
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the landing page
        run: npm run build:site
        env:
          PAGES_BASE: /farming-game/

      # Vite emits no underscore-prefixed directories, but Pages still runs Jekyll
      # over the artifact unless told otherwise.
      - run: touch dist-site/.nojekyll

      # actions/configure-pages is deliberately not used. It takes no inputs here and
      # nothing references its outputs: Pages is already enabled on this repository, and
      # the base path is set explicitly above as PAGES_BASE rather than discovered. All it
      # contributed was a third action to download, and downloading it is what failed —
      # codeload answered 429 three times in a row and took the whole deploy with it, on a
      # build that was otherwise finished. One less thing to fetch is one less thing to
      # rate-limit.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      # Creating the deployment is a single API call with no retry inside the action: when
      # Pages answers 503 the whole run goes red on a build that was otherwise finished.
      # That is not hypothetical here — three of the last eight runs died that way, on
      # 503 and on 429, while the commits either side deployed cleanly. So the first
      # attempt is allowed to fail and a second one runs only if it did.
      #
      # Deliberately one retry, not a loop: a second 503 a minute later means Pages is
      # actually down, and a run that keeps trying for ten minutes reports a real outage
      # as a slow success. Deliberately no third-party retry action either, for the same
      # reason configure-pages was dropped above — every action fetched is another thing
      # that can be rate-limited.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # No continue-on-error here on purpose: this one is allowed to take the job down.
      # Two 503s a minute apart is a real outage, and a green run would be a lie.
      - name: Deploy again if Pages was briefly unavailable
        id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
